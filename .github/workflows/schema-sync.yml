name: Schema Sync & Release

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch: # Manual trigger

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch the release workflows for the new tag
    env:
      PYTHONHASHSEED: "0" # Deterministic hash ordering for stable schema output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history needed for tagging

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Test schema pipeline scripts
        run: python3 -m unittest discover -s scripts -p '*_test.py'

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0

      - name: Fetch live Bitbucket spec
        run: |
          curl -sSL "https://dac-static.atlassian.com/cloud/bitbucket/swagger.v3.json" \
            -o /tmp/bitbucket-raw.json
          echo "Fetched $(wc -c < /tmp/bitbucket-raw.json) bytes"

      - name: Enrich spec (inject operationIds from the lockfile)
        run: |
          python3 scripts/enrich_spec.py /tmp/bitbucket-raw.json /tmp/bitbucket-enriched.json \
            --lock schema/operation-ids.json

      - name: Partition spec (extract paths + resolve $refs + retain dropped operations)
        run: python3 scripts/partition_spec.py /tmp/bitbucket-enriched.json schema/ --all


      - name: Detect schema change
        id: diff
        run: |
          git diff --quiet schema/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate types (oapi-codegen)
        if: steps.diff.outputs.changed == 'true'
        run: oapi-codegen --config oapi-codegen.yaml schema/pr-schema.yaml

      # Every schema/*-schema.yaml group is regenerated, so new groups need no
      # workflow change.
      - name: Regenerate CLI commands, MCP tools and Terraform resources
        if: steps.diff.outputs.changed == 'true'
        run: make generate

      - name: Regenerate docs (Terraform, MCP tool reference, E2E coverage)
        if: steps.diff.outputs.changed == 'true'
        run: make generate-docs

      - name: Format, build, vet & test
        if: steps.diff.outputs.changed == 'true'
        run: |
          gofmt -w .
          go build ./...
          go vet ./...
          go test ./...

      - name: Commit + tag release
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "bb-cli-bot"
          git config user.email "bot@github.com"
          git add schema/ internal/generated/ internal/commands/ internal/mcptools/ internal/tfprovider/ docs/ examples/ tests/

          # Determine next semver patch based on latest tag
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            VERSION="v1.0.0"
          else
            # Strip leading 'v', split, bump patch
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          git commit -m "chore: schema sync ${VERSION}"
          git tag -a "$VERSION" -m "chore: schema sync ${VERSION}"
          git push --follow-tags

          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
          # tag push alone never starts a release. workflow_dispatch is exempt.
          for workflow in release.yml docker.yml terraform-release.yml; do
            gh workflow run "$workflow" --ref "$VERSION"
          done
        env:
          GH_TOKEN: ${{ github.token }}
