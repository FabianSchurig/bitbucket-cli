name: Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: bb-cli
            image: bitbucket-cli
          - target: bb-mcp
            image: bitbucket-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize repository owner
        id: owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Determine image tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.lowercase }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM for ${{ matrix.image }}
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ steps.owner.outputs.lowercase }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          output-file: ${{ runner.temp }}/sbom-${{ matrix.image }}.spdx.json
          upload-release-assets: false

      # Signed, digest-bound SBOM that image users can fetch with
      # `gh attestation verify` or `cosign` without access to this repository.
      - name: Attest SBOM for ${{ matrix.image }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.lowercase }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true

      - name: Scan ${{ matrix.image }} for CVEs
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        if: ${{ !cancelled() }}
        with:
          image: ghcr.io/${{ steps.owner.outputs.lowercase }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          fail-build: false
          severity-cutoff: critical

      - name: Upload CVE scan report
        uses: github/codeql-action/upload-sarif@1a818fd5f97ed0ee9a823421bd5b171add01227f # v4.36.2
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: docker-${{ matrix.image }}

      # scan-action emits one format per run, so the consumer-facing reports are
      # generated from the SBOM (cheap, and guaranteed to match the attested SBOM).
      - name: Build CVE report (JSON) for ${{ matrix.image }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        with:
          sbom: ${{ runner.temp }}/sbom-${{ matrix.image }}.spdx.json
          output-format: json
          output-file: ${{ runner.temp }}/cves-${{ matrix.image }}.json
          fail-build: false
          severity-cutoff: critical

      - name: Build CVE report (table) for ${{ matrix.image }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        with:
          sbom: ${{ runner.temp }}/sbom-${{ matrix.image }}.spdx.json
          output-format: table
          output-file: ${{ runner.temp }}/cves-${{ matrix.image }}.txt
          fail-build: false
          severity-cutoff: critical

      - name: Upload CVE reports for ${{ matrix.image }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        with:
          name: cves-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/cves-${{ matrix.image }}.json
            ${{ runner.temp }}/cves-${{ matrix.image }}.txt
          if-no-files-found: error

  publish-image-security:
    name: Publish image SBOM and CVE reports
    needs: [docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download image SBOM and CVE reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: reports
          pattern: '*-bitbucket-*'
          merge-multiple: true

      # release.yml (GoReleaser) creates the release for the same tag in parallel,
      # so wait for it instead of racing it.
      - name: Attach reports to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l reports
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            echo "Release $TAG not published yet, retrying in 20s ($attempt/30)"
            sleep 20
          done
          gh release view "$TAG" --repo "$REPO" >/dev/null
          gh release upload "$TAG" reports/* --clobber --repo "$REPO"

  publish-mcp:
    name: Publish to MCP Registry
    needs: [docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version in server.json
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '
            .version = $v |
            .packages[0].identifier = ("ghcr.io/fabianschurig/bitbucket-mcp:" + $v)
          ' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -fSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
