name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.11.4

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Normalize coverage report for SonarQube
        run: |
          test -s coverage.out
          awk 'NR == 1 || ($0 !~ /\.gen\.go:/ && $0 !~ /^github.com\/FabianSchurig\/bitbucket-cli\/scripts\//)' coverage.out \
            | sed '2,$ s#^github.com/FabianSchurig/bitbucket-cli/##' \
            > coverage.out.tmp
          mv coverage.out.tmp coverage.out

      - name: SonarQube Scan
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build bb-cli image
        run: docker build --target bb-cli -t bb-cli:test .

      - name: Verify bb-cli image
        run: timeout 10s docker run --rm bb-cli:test --help

      - name: Build bb-mcp image
        run: docker build --target bb-mcp -t bb-mcp:test .

      - name: Verify bb-mcp image
        run: timeout 10s docker run --rm bb-mcp:test --help

  # Runs only on push events so that the GITHUB_TOKEN write scope is never
  # issued to a pull-request runner (including fork PRs).
  # Credentials are intentionally persisted so git-auto-commit-action can push.
  format:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: gofmt -w .

      - name: Regenerate E2E coverage doc
        run: go run scripts/gen_e2e_coverage/main.go

      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "style: apply gofmt formatting [skip ci]"
          file_pattern: "*.go docs/e2e-coverage.md"
